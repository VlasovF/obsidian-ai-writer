services:
  redis:
    image: redis:7-alpine
    container_name: ${DOCKER_PREFIX:-obsidian}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - obsidian_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: ${DOCKER_PREFIX:-obsidian}-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - obsidian_network
    environment:
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ${DOCKER_PREFIX:-obsidian}-api
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ${VAULT_PATH:-./vault}:/app/vault
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    networks:
      - obsidian_network
      - ollama_network
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ${DOCKER_PREFIX:-obsidian}-worker
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ${VAULT_PATH:-./vault}:/app/vault
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    networks:
      - obsidian_network
      - ollama_network
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["celery", "-A", "src.infrastructure.celery_app", "worker", "--loglevel=info", "-Q", "notes,index"]

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.beat
    container_name: ${DOCKER_PREFIX:-obsidian}-beat
    restart: unless-stopped
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    networks:
      - obsidian_network
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "src.infrastructure.celery_app", "beat", "--loglevel=info", "--schedule=/app/celerybeat-schedule"]


networks:
  obsidian_network:
    driver: bridge
    name: ${DOCKER_NETWORK:-obsidian_network}
  ollama_network:
    external: true
    name: ${OLLAMA_NETWORK:-ollama_network}

volumes:
  qdrant_storage: